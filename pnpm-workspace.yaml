packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (native binaries only).
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

# pnpm 12 refuses versions younger than its minimum release age unless listed here.
# Entries were added automatically by `pnpm install` when pinning the latest stable versions.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.11'
  - '@turbo/darwin-arm64@2.11.11'
  - '@turbo/linux-64@2.11.11'
  - '@turbo/linux-arm64@2.11.11'
  - '@turbo/windows-64@2.11.11'
  - '@turbo/windows-arm64@2.11.11'
  - prettier@3.10.0
  - turbo@2.11.11
  - lucide-react@1.72.0
  - vite@8.3.8
  - react-hook-form@7.92.0
  - framer-motion@14.13.0
  - motion-dom@14.13.0
  - motion@14.13.0
