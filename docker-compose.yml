# Environnement local de developpement : PostgreSQL + schema AgriCoop
services:
  postgres:
    image: postgres:16
    container_name: agricoop-postgres
    environment:
      POSTGRES_USER: agricoop
      POSTGRES_PASSWORD: agricoop_dev   # local uniquement, jamais en production
      POSTGRES_DB: agricoop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./contracts/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricoop -d agricoop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
