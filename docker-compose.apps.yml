# App-side services for local development. Use TOGETHER with the root compose file (Postgres):
#
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d                 # infra only
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d  # + app images
#
# Infra (always on): db-seed (one shot), keycloak, redpanda, redpanda-console, mailpit.
# App images (profile "apps"): api, qr, outbox-relay, web, backoffice. During development you usually
# run them with `pnpm dev` instead, against this infra.
#
# Ports: postgres 5433 (root file) · keycloak 8080 · redpanda 19092 (Kafka API) · console 8088 ·
#        mailpit 8025 (UI) / 1025 (SMTP) · api 3000 · qr 3001 · relay 3002 · web 5173 · backoffice 5174

x-node-service: &node-service
  restart: unless-stopped
  profiles: ['apps']
  depends_on:
    postgres:
      condition: service_healthy
    db-seed:
      condition: service_completed_successfully

services:
  db-seed:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: agricoop
      PGDATABASE: agricoop
      PGPASSWORD: ${POSTGRES_PASSWORD:-agricoop_dev}
    volumes:
      - ./apps/dev/seed:/seed:ro
    entrypoint:
      - sh
      - -c
      - 'for f in /seed/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$f" || exit 1; done'
    restart: 'no'

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env (see .env.example)}
      KC_HEALTH_ENABLED: 'true'
      # Tokens are issued for the browser-facing URL; containers reach Keycloak on keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      # Substituted into apps/keycloak/realm-agricoop.json at import time.
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:?set KC_DEMO_PASSWORD in .env (see .env.example)}
      KC_PROVISIONER_SECRET: ${KC_PROVISIONER_SECRET:?set KC_PROVISIONER_SECRET in .env (see .env.example)}
      KC_API_CLIENT_SECRET: ${KC_API_CLIENT_SECRET:?set KC_API_CLIENT_SECRET in .env (see .env.example)}
    ports:
      - '8080:8080'
    volumes:
      - ./apps/keycloak/realm-agricoop.json:/opt/keycloak/data/import/realm-agricoop.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - '19092:19092'
      - '18081:18081'
      - '9644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v3.14.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: 'true'
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - '8088:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '8025:8025'
      - '1025:1025'
    restart: unless-stopped

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/docker/node-service.Dockerfile
      args: { APP: api }
    image: agricoop/api:dev
    environment:
      PORT: 3000
      DATABASE_URL: postgres://agricoop:${POSTGRES_PASSWORD:-agricoop_dev}@postgres:5432/agricoop
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      LOG_LEVEL: info
      # Tokens carry the browser-facing issuer; keys are fetched on the internal hostname.
      OIDC_ISSUER: http://localhost:8080/realms/agricoop
      OIDC_JWKS_URL: http://keycloak:8080/realms/agricoop/protocol/openid-connect/certs
      SMTP_URL: smtp://mailpit:1025
      PAYMENT_MOCK_SECRET: ${PAYMENT_MOCK_SECRET:-dev-only-payment-mock-secret}
    ports:
      - '3000:3000'

  qr:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/docker/node-service.Dockerfile
      args: { APP: qr }
    image: agricoop/qr:dev
    environment:
      PORT: 3001
      DATABASE_URL: postgres://agricoop:${POSTGRES_PASSWORD:-agricoop_dev}@postgres:5432/agricoop
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      LOG_LEVEL: info
      OIDC_ISSUER: http://localhost:8080/realms/agricoop
      OIDC_JWKS_URL: http://keycloak:8080/realms/agricoop/protocol/openid-connect/certs
    ports:
      - '3001:3001'

  outbox-relay:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/docker/node-service.Dockerfile
      args: { APP: outbox-relay }
    image: agricoop/outbox-relay:dev
    environment:
      PORT: 3002
      DATABASE_URL: postgres://agricoop:${POSTGRES_PASSWORD:-agricoop_dev}@postgres:5432/agricoop
      KAFKA_BROKERS: redpanda:9092
      LOG_LEVEL: info
    ports:
      - '3002:3002'

  web:
    build:
      context: .
      dockerfile: apps/docker/spa.Dockerfile
      args: { APP: web }
    image: agricoop/web:dev
    profiles: ['apps']
    ports:
      - '5173:8080'
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: apps/docker/spa.Dockerfile
      args: { APP: backoffice }
    image: agricoop/backoffice:dev
    profiles: ['apps']
    ports:
      - '5174:8080'
    restart: unless-stopped

volumes:
  redpanda-data:
