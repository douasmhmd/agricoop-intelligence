<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3f4a1f" />
    <!-- Storefront photos (apps/web/src/lib/images.ts): open the connection early for the hero. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>AgriCoop — Produits des coopératives</title>
    <!-- Theme and pre-rendered shell decided before the first paint (external: the CSP allows no
         inline script). The production build puts the home header + hero inside #prerender. -->
    <script src="/theme-init.js"></script>
    <style>
      #prerender {
        display: none;
      }
      html.prerendered #prerender {
        display: contents;
      }
    </style>
    <meta
      name="description"
      content="Huiles d'olive, olives et cosmétiques des coopératives agricoles marocaines, vendus en direct. Chaque produit est traçable par QR code."
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime configuration (nginx renders it in containers; empty placeholder in dev). -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
