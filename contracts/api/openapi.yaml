        - lot_id
        - produit_id
        - produit_code
        - produit_nom
        - niveau_qr
        - numero
        - date_fabrication
        - date_peremption
        - quantite_initiale
        - stock
        - statut
        - is_synthetic
        - jours_restants
        - niveau
